name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get install -y rpm
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-pty
      - run: npm run build
      - run: npx electron-builder --linux --config.npmRebuild=false --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx electron-builder --win --config.npmRebuild=false --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
